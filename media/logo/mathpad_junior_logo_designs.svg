<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 1. App Icon Base Tile -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" stroke="#e2e8f0" stroke-width="4"/>

  <!-- 2. 4-Square Math Matrix -->
  <g transform="translate(68, 68) scale(13.4)" filter="url(#softShadow)">
    <!-- + -->
    <rect x="2" y="2" width="11" height="11" rx="3" fill="#f97316" />
    <path d="M7.5 5v5M5 7.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- - -->
    <rect x="15" y="2" width="11" height="11" rx="3" fill="#06b6d4" />
    <path d="M18 7.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- x -->
    <rect x="2" y="15" width="11" height="11" rx="3" fill="#8b5cf6" />
    <path d="M5.5 18.5l4 4M9.5 18.5l-4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <!-- ÷ -->
    <rect x="15" y="15" width="11" height="11" rx="3" fill="#22c55e" />
    <path d="M18 20.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="20.5" cy="18" r="1" fill="#ffffff" />
    <circle cx="20.5" cy="23" r="1" fill="#ffffff" />
  </g>
</svg>
