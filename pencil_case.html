<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MathPad Junior — The Pencil Case</title>
  <link rel="icon" type="image/svg+xml" href="./media/logo/mathpad_favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />

  <!-- Google Fonts: Fredoka & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/workbook.css" />
  <link rel="stylesheet" href="./css/canvas.css" />

  <style>
    body {
      background-color: var(--bg-main, #f8fafc);
      color: var(--text-dark, #0f172a);
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .shop-wrapper {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-sizing: border-box;
    }

    /* Hero Banner Card */
    .shop-hero-card {
      background: #ffffff;
      border: 1.5px solid var(--border-light, #e2e8f0);
      border-radius: 24px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
      flex-wrap: wrap;
    }

    .shop-hero-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .shop-avatar-icon {
      background: var(--theme-subtle, #fdf4ff);
      border: 2px solid var(--theme-border, #f0abfc);
      width: 72px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.12);
      flex-shrink: 0;
    }

    .shop-hero-text h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-dark, #0f172a);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .shop-hero-text p {
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 4px;
    }

    .shop-hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-to-app-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1.5px solid var(--border-light, #e2e8f0);
      border-radius: 14px;
      padding: 10px 18px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .back-to-app-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
      transform: translateY(-1px);
    }

    /* Segmented Category Navigation */
    .shop-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .shop-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-tab-btn {
      background: #ffffff;
      border: 1.5px solid var(--border-light, #e2e8f0);
      border-radius: 14px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 0.86rem;
      color: #64748b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .cat-tab-btn:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .cat-tab-btn.active {
      background: var(--theme-accent, #a855f7);
      color: #ffffff;
      border-color: var(--theme-accent, #a855f7);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.25);
    }

    /* Items Grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: #ffffff;
      border: 2px solid var(--border-light, #e2e8f0);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .item-card.is-equipped {
      border-color: var(--theme-accent, #a855f7);
      background: var(--theme-subtle, #fdf4ff);
    }

    .preview-box {
      width: 100%;
      height: 100px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1.5px solid var(--border-light, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .item-meta h3 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark, #0f172a);
      margin-bottom: 4px;
    }

    .item-meta p {
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      line-height: 1.4;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn.buy {
      background: #059669;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    }

    .action-btn.buy:hover {
      background: #047857;
    }

    .action-btn.equip {
      background: var(--theme-accent, #a855f7);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
    }

    .action-btn.equip:hover {
      filter: brightness(0.92);
    }

    .action-btn.equipped {
      background: #e2e8f0;
      color: #475569;
      cursor: default;
    }

    .action-btn.locked {
      background: #f1f5f9;
      color: #94a3b8;
      border: 1.5px solid var(--border-light, #e2e8f0);
      cursor: not-allowed;
      font-size: 0.8rem;
    }

    /* JSON Data Reference View */
    .data-viewer-card {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 18px;
      padding: 20px;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      max-height: 520px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <!-- Top App Navigation Bar -->
  <header class="page-header" style="background:#ffffff; border-bottom:1.5px solid var(--border-light); padding:10px 20px; display:flex; justify-content:space-between; align-items:center;">
    <div class="header-left">
      <a href="index.html#home" class="navbar-brand" title="Return to MathPad Junior">
        <!-- 4-Square Math Matrix -->
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" class="brand-matrix-svg">
          <rect x="2" y="2" width="11" height="11" rx="3" fill="#f97316" />
          <path d="M7.5 5v5M5 7.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
          <rect x="15" y="2" width="11" height="11" rx="3" fill="#06b6d4" />
          <path d="M18 7.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
          <rect x="2" y="15" width="11" height="11" rx="3" fill="#8b5cf6" />
          <path d="M5.5 18.5l4 4M9.5 18.5l-4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
          <rect x="15" y="15" width="11" height="11" rx="3" fill="#22c55e" />
          <path d="M18 20.5h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="20.5" cy="18" r="1" fill="#ffffff" />
          <circle cx="20.5" cy="23" r="1" fill="#ffffff" />
        </svg>

        <span class="brand-title-3">
          MathPad <span class="brand-junior">Junior</span>
          <span class="version-tag">v0.16</span>
        </span>
      </a>
    </div>

    <div class="header-right" style="display:flex; align-items:center; gap:10px;">
      <div class="coin-badge-header" id="walletBalance" title="Banked Math Stars">
        ⭐ <span id="userCoins">0</span>
      </div>
      <div class="player-header-badge" style="cursor:default;" title="Player Profile">
        <span class="badge-name" id="badgeName">Eli</span>
        <span class="badge-avatar" id="badgeAvatar">🦄</span>
      </div>
    </div>
  </header>

  <div class="shop-wrapper">

    <!-- Hero Card Banner -->
    <div class="shop-hero-card">
      <div class="shop-hero-left">
        <div class="shop-avatar-icon">
          <!-- The Peek-a-Boo Pouch Vector Illustration -->
          <svg viewBox="0 0 160 120" width="56" height="42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Peeking Stationery Tools -->
            <!-- Ruler (Purple) -->
            <rect x="36" y="24" width="18" height="50" rx="3" fill="#8b5cf6" transform="rotate(-15 36 24)" />
            <line x1="42" y1="36" x2="48" y2="34" stroke="#ffffff" stroke-width="2" />
            <line x1="44" y1="44" x2="50" y2="42" stroke="#ffffff" stroke-width="2" />

            <!-- Green Stylus/Pen -->
            <rect x="74" y="16" width="14" height="60" rx="4" fill="#22c55e" />
            <polygon points="74,16 88,16 81,4" fill="#facc15" />
            <polygon points="78,8 84,8 81,4" fill="#0f172a" />

            <!-- Rainbow Pencil -->
            <defs>
              <linearGradient id="pouchRainbow" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#f97316" />
                <stop offset="50%" stop-color="#06b6d4" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <rect x="102" y="22" width="14" height="54" rx="4" fill="url(#pouchRainbow)" transform="rotate(14 102 22)" />
            <polygon points="98,22 112,25 107,10" fill="#fef08a" />

            <!-- Pouch Body (Warm Canvas Slate/Blue) -->
            <rect x="16" y="52" width="128" height="56" rx="14" fill="#2563eb" />
            <!-- Front Pocket Trim -->
            <path d="M16 68 C40 76, 120 76, 144 68 L144 94 A14 14 0 0 1 130 108 L30 108 A14 14 0 0 1 16 94 Z" fill="#1d4ed8" />

            <!-- Golden Zipper Track -->
            <rect x="22" y="52" width="116" height="5" rx="2" fill="#fbbf24" />
            <!-- Zipper Pull Tag -->
            <rect x="26" y="54" width="8" height="14" rx="2" fill="#f59e0b" />
            <circle cx="30" cy="64" r="2" fill="#ffffff" />
          </svg>
        </div>
        <div class="shop-hero-text">
          <h1>The Pencil Case</h1>
          <p>Reward Shop & Equipment Customization</p>
        </div>
      </div>

      <div class="shop-hero-actions">
        <a href="index.html#home" class="back-to-app-btn">
          <span>← Back to MathPad</span>
        </a>
      </div>
    </div>

    <!-- Category Tabs -->
    <nav class="shop-nav" id="categoryNav">
      <button class="cat-tab-btn active" onclick="switchCategory('inks')">🖊️ Magic Inks</button>
      <button class="cat-tab-btn" onclick="switchCategory('papers')">📐 Paper Textures</button>
      <button class="cat-tab-btn" onclick="switchCategory('deskMats')">🖼️ Palm Rest Mats</button>
      <button class="cat-tab-btn" onclick="switchCategory('accessories')">👑 Mascot Gear</button>
      <button class="cat-tab-btn" onclick="switchCategory('stickers')">⭐ Stickers</button>
      <button class="cat-tab-btn" onclick="switchCategory('json')" style="margin-left:auto;">📋 Data Reference</button>
    </nav>

    <!-- Main Content Container -->
    <main id="shopMain">
      <!-- Items Grid -->
      <div class="shop-grid" id="itemsGrid"></div>

      <!-- JSON Data Reference Viewer -->
      <div id="jsonDataContainer" style="display:none;">
        <div class="data-viewer-card">
          <pre id="jsonViewer"></pre>
        </div>
      </div>
    </main>

  </div>

  <!-- Master Data & Shop Controller Script -->
  <script type="module">
    import { pencilCaseCatalog } from './js/data/pencilCaseData.js';
    import { studentProgress } from './js/data/studentProgress.js';

    // Apply stored theme styles
    studentProgress.applyStoredStyles();

    // Sync user state with actual localStorage studentProgress
    const userState = {
      coins: studentProgress.coins || 0,
      streak: 5,
      perfectQuizzes: 2,
      ownedItems: JSON.parse(localStorage.getItem('elismark_owned_items') || '["ink_lilac", "ink_red", "ink_green", "ink_blue", "ink_black", "paper_blank", "paper_squares", "paper_dots", "paper_lines"]'),
      equippedItems: {
        inks: localStorage.getItem('elismark_active_ink') || 'ink_lilac',
        papers: studentProgress.userPaper || 'paper-blank',
        deskMats: localStorage.getItem('elismark_active_mat') || 'mat_default',
        accessories: localStorage.getItem('elismark_active_acc') || 'acc_none',
        stickers: 'stk_star'
      }
    };

    let activeCat = 'inks';

    function renderWallet() {
      const el = document.getElementById('userCoins');
      if (el) el.innerText = userState.coins;

      const nameEl = document.getElementById('badgeName');
      if (nameEl) nameEl.innerText = studentProgress.playerName || 'Eli';

      const avatarEl = document.getElementById('badgeAvatar');
      if (avatarEl) avatarEl.innerText = studentProgress.userAvatar || '🦄';
    }

    function switchCategory(catId) {
      activeCat = catId;
      document.querySelectorAll('.cat-tab-btn').forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.classList.toggle('active', 
          (catId === 'inks' && text.includes('ink')) ||
          (catId === 'papers' && text.includes('paper')) ||
          (catId === 'deskMats' && text.includes('palm')) ||
          (catId === 'accessories' && text.includes('gear')) ||
          (catId === 'stickers' && text.includes('sticker')) ||
          (catId === 'json' && text.includes('data'))
        );
      });

      const grid = document.getElementById('itemsGrid');
      const jsonContainer = document.getElementById('jsonDataContainer');

      if (catId === 'json') {
        grid.style.display = 'none';
        jsonContainer.style.display = 'block';
        document.getElementById('jsonViewer').innerText = JSON.stringify(pencilCaseCatalog, null, 2);
        return;
      }

      grid.style.display = 'grid';
      jsonContainer.style.display = 'none';
      renderCategoryItems(catId);
    }

    window.switchCategory = switchCategory;

    function renderCategoryItems(catId) {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      const items = pencilCaseCatalog.items[catId] || [];

      items.forEach(item => {
        const card = document.createElement('div');
        const isOwned = userState.ownedItems.includes(item.id) || item.unlockedByDefault;
        const isEquipped = userState.equippedItems[catId] === item.id;
        
        let isLocked = false;
        let lockReason = '';

        if (item.unlockReq) {
          if (item.unlockReq.type === 'streak' && userState.streak < item.unlockReq.value) {
            isLocked = true;
            lockReason = `🔒 ${item.unlockReq.label}`;
          } else if (item.unlockReq.type === 'perfectQuiz' && userState.perfectQuizzes < item.unlockReq.value) {
            isLocked = true;
            lockReason = `🔒 ${item.unlockReq.label}`;
          }
        }

        card.className = `item-card ${isEquipped ? 'is-equipped' : ''}`;

        // Build preview display
        let previewHtml = '';
        if (item.previewHtml) {
          previewHtml = item.previewHtml;
        } else if (catId === 'papers') {
          previewHtml = `<div style="width:100%; height:100%; background-color:#ffffff; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.1rem; color:#64748b;">${item.name}</div>`;
        } else if (catId === 'deskMats') {
          previewHtml = `<div style="width:100%; height:100%; border-radius:8px; background:${item.style}; display:flex; align-items:center; justify-content:center; color:#ffffff; font-weight:800; font-size:0.8rem;">Desk Mat Preview</div>`;
        } else if (item.icon) {
          previewHtml = `<span style="font-size: 2.8rem;">${item.icon}</span>`;
        }

        let actionButtonHtml = '';
        if (isEquipped) {
          actionButtonHtml = `<button class="action-btn equipped">✓ Equipped</button>`;
        } else if (isOwned) {
          actionButtonHtml = `<button class="action-btn equip" onclick="equipItem('${catId}', '${item.id}')">Equip</button>`;
        } else if (isLocked) {
          actionButtonHtml = `<button class="action-btn locked" disabled>${lockReason}</button>`;
        } else {
          actionButtonHtml = `<button class="action-btn buy" onclick="buyItem('${catId}', '${item.id}', ${item.price})">⭐ ${item.price} Stars</button>`;
        }

        card.innerHTML = `
          <div class="preview-box">
            ${previewHtml}
          </div>
          <div class="item-meta">
            <h3>${item.name}</h3>
            <p>${item.desc || ''}</p>
          </div>
          <div class="item-actions">
            ${actionButtonHtml}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    window.buyItem = function(catId, itemId, price) {
      if (userState.coins >= price) {
        userState.coins -= price;
        studentProgress.coins = userState.coins;
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem('elismark_coins', userState.coins.toString());
        }
        userState.ownedItems.push(itemId);
        localStorage.setItem('elismark_owned_items', JSON.stringify(userState.ownedItems));
        userState.equippedItems[catId] = itemId;
        renderWallet();
        renderCategoryItems(catId);
      } else {
        alert("Not enough Math Stars! Practice more math problems to earn more ⭐!");
      }
    };

    window.equipItem = function(catId, itemId) {
      userState.equippedItems[catId] = itemId;
      if (catId === 'papers') {
        studentProgress.setPaper(itemId);
      }
      localStorage.setItem(`elismark_active_${catId}`, itemId);
      renderCategoryItems(catId);
    };

    // Initial render
    renderWallet();
    switchCategory('inks');
  </script>
</body>

</html>
